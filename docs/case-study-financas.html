<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case study Finanças (visual real do jogo)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Cores de Styles/Custom.xaml; medidas copiadas do print da tela Agenda (1920px) */
:root{--bg:#0F0F0F;--surf:#141414;--card:#1F1F1F;--hov:#262626;--line:#2D2D2D;--red:#E53935;--txt:#F1F1F1;--sub:#AAAAAA;--gain:#3EA66B;--loss:#E5534B;--twitch:#9B7BD6;--amber:#D9A441}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--txt);font-family:Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
/* barra de prévia (fora do jogo) */
.bar0{background:#1a1a1a;border-bottom:1px solid #333;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:#aaa;position:sticky;top:0;z-index:9}
.chip{background:#262626;border:1px solid #3a3a3a;color:#ddd;font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer}
.chip:hover{background:#333}.chip.on{background:#E53935;border-color:#E53935;color:#fff}
.leg{padding:8px 14px;font-size:12.5px;color:#aaa;line-height:1.5;background:#111;border-bottom:1px solid #222}
.leg b{color:#eee}.leg .p{color:#3EA66B}.leg .c{color:#E5534B}
#hold{position:relative;overflow:hidden}
/* janela do jogo: 1920 x 1041 como no print */
.win{width:1920px;height:1041px;transform-origin:0 0;background:var(--bg);position:absolute;left:0;top:0}
.title{height:23px;background:#fff;color:#000;font-size:12px;display:flex;align-items:center;padding-left:21px;position:relative}
.title:before{content:"";position:absolute;left:2px;top:3px;width:14px;height:16px;background:#c33;border-radius:2px}
.title span{margin-left:0;letter-spacing:0}
.title i{position:absolute;right:20px;top:0;font-style:normal;font-size:13px;letter-spacing:34px}
.game{display:grid;grid-template-columns:236px 1fr;grid-template-rows:64px 1fr;height:1018px}
.side{grid-row:1/3;background:var(--surf);border-right:1px solid var(--line);padding:0 9px}
.logo{height:64px;display:flex;align-items:center;gap:9px;margin-left:6px;font-weight:700;font-size:19px}
.logo i{width:32px;height:24px;background:var(--red);border-radius:7px;display:grid;place-items:center}
.logo i:after{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.chan{display:flex;gap:9px;align-items:center;padding:0 10px;height:44px;margin:2px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;position:relative}
.av{width:28px;height:28px;border-radius:50%;background:#E8A32E;display:grid;place-items:center;font-weight:700;font-size:13px;color:#3a2a08}
.chan b{display:block;font-size:12px;font-weight:700;line-height:1.1}.chan small{display:block;font-size:11px;color:var(--sub);line-height:1.1}
.chan:after{content:"";position:absolute;right:11px;top:21px;border-top:3px solid #aaa;border-left:2.5px solid transparent;border-right:2.5px solid transparent}
.nav{display:flex;align-items:center;gap:14px;height:40px;padding:0 13px;border-radius:8px;font-size:15px;font-weight:500;color:var(--txt);margin-bottom:4px;border:1px solid transparent}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-left:1px}
.nav.on{background:var(--card);border-color:var(--line)}.nav.on svg{stroke:var(--red)}
.nav.soon{color:#7d7d7d;font-weight:400}
.nav em{margin-left:auto;font-style:normal;font-size:10px;color:#7d7d7d;background:#1a1a1a;border-radius:6px;padding:1px 5px}
.head{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px 0 20px;display:flex;align-items:center}
.head h3{font-size:19px;font-weight:700;line-height:1.1;margin-top:-4px}
.pills{display:flex;gap:7px;margin-top:3px}
.hp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--txt);display:flex;align-items:center;gap:7px;height:19px}
.hp svg{width:12px;height:12px;fill:none;stroke:#ddd;stroke-width:1.8}
.hs{margin-left:auto;display:flex;gap:22px;align-items:center}
.hs small{display:block;font-size:11px;color:var(--sub);line-height:1}.hs b{font-size:19px;font-weight:700;display:block;line-height:1.1}
.hs .m b{font-size:21px;color:var(--gain)}
.btn{background:var(--red);color:#fff;border-radius:8px;height:35px;padding:0 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
.btn:before{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.btn.n:before{display:none}
.ic{width:20px;height:20px;fill:none;stroke:#ccc;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-left:4px}
.main{padding:0;overflow:hidden;background:var(--bg)}
.col{width:980px;margin:16px auto 0;display:flex;flex-direction:column;gap:12px}
.col h1{font-size:28px;font-weight:700;line-height:1.1}
.col .sub{color:var(--sub);font-size:14px;margin-top:-8px;color:#c9c9c9}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{padding:8px 16px;font-size:14px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent}
.tab.on{color:var(--txt);border-color:var(--red)}.tab em{font-style:normal;font-size:10px;font-weight:500;color:#7d7d7d;background:#1a1a1a;border-radius:6px;padding:1px 5px;margin-left:8px}
.g{display:grid;gap:12px}
.cd{background:#1B1B1B;border:1px solid var(--line);border-radius:10px;padding:14px 15px;min-width:0}
.k{font-size:12px;color:var(--sub)}.v{font-size:26px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}.v.xl{font-size:38px}
.up{color:var(--gain)}.dn{color:var(--loss)}.mu{color:var(--sub)}
.t{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.t small{font-size:11px;color:var(--sub);font-weight:400}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:11px;font-weight:700;color:var(--txt)}
.pill.g1{color:var(--gain)}.pill.l1{color:var(--loss)}.pill.a1{color:var(--amber)}
.tr{display:grid;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.tr:hover{background:var(--hov)}.tr.h{font-size:11px;font-weight:600;color:var(--sub)}.tr.h:hover{background:none}
.tr.sub{padding-left:26px;color:var(--sub);font-size:12px}
.tr.me{background:rgba(229,57,53,.16);border-top:1px solid var(--red);border-bottom:1px solid var(--red);font-weight:700}
.r{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--hov);overflow:hidden;display:flex}
.row2{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}.row2:last-child{border:0}
svg.ch{display:block;width:100%}
</style></head><body>
<div class="bar0"><b style="color:#eee">Prévia Finanças (fora do jogo):</b><span id="sel" style="display:flex;gap:6px"></span><span>Exemplo: semana 12, canal médio</span></div>
<div class="leg" id="leg"></div>
<div id="hold"><div class="win" id="win"></div></div>
<script>
var IC={
 home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 film:'<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M8 4v16M16 4v16M3.5 9h4.5M3.5 15h4.5M16 9h4.5M16 15h4.5"/>',
 plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
 bag:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>',
 cup:'<path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 20h8"/>',
 dollar:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.4-1-1.4-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1.2 0-2.2-.6-2.6-1.6M12 6v1.7M12 16.3V18"/>',
 cap:'<path d="M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.8-6 6-6s6 2.5 6 6M16 4.5a3.5 3.5 0 010 7M18 14.5c2 .7 3.5 2.7 3.5 5.5"/>',
 save:'<path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/>',
 out:'<path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/>'};
function ico(n){return '<svg viewBox="0 0 24 24">'+IC[n]+'</svg>'}
function shell(inner,nch){
 var it=function(n,i,cls){return '<div class="nav '+(cls||'')+'">'+ico(i)+n+(cls=='soon'?'<em>Em breve</em>':'')+'</div>'};
 return '<div class="title"><span>TubeStar</span><i>—▢✕</i></div><div class="game"><div class="side"><div class="logo"><i></i>TubeStar</div>'+
 '<div class="chan"><div class="av">V</div><div><b>Visão geral</b><small>'+(nch||'1 canal')+'</small></div></div>'+
 it('Principal','home','soon')+it('Agenda','cal')+it('Meus vídeos','film')+it('Criar vídeo','plus')+it('Loja','bag')+it('Top TubeStars','cup')+
 it('Finanças','dollar','on')+it('Universidade','cap','soon')+it('Funcionários','users','soon')+
 '</div><div class="head"><div><h3>Finanças</h3><div class="pills"><span class="hp"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17"/></svg>Ano 1 · Semana 12 · Dia 84</span><span class="hp" style="font-weight:600">Anúncios fracos</span></div></div>'+
 '<div class="hs"><div class="m"><small>Dinheiro</small><b>$2.340,00</b></div><div><small>Inscritos</small><b>8.412</b></div><div class="btn">Próximo dia</div><svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px;margin:0 8px">'+IC.save+'</svg><svg class="ic" viewBox="0 0 24 24" style="margin:0">'+IC.out+'</svg></div></div>'+
 '<div class="main"><div class="col"><h1>Finanças</h1><div class="sub">Veja para onde vai o seu dinheiro e quanto você tem de patrimônio.</div>'+inner+'</div></div></div>'}
function tabs(){return '<div class="tabs"><div class="tab on">Visão geral</div><div class="tab">Investimentos<em>Em breve</em></div><div class="tab">Mercado<em>Em breve</em></div></div>'}
function kpi(l,v,cls,sub){return '<div class="cd"><div class="k">'+l+'</div><div class="v '+(cls||'')+'">'+v+'</div>'+(sub?'<div class="k" style="margin-top:3px;font-size:11px">'+sub+'</div>':'')+'</div>'}
var pat=[1000,1080,1130,1250,1240,1420,1700,1920,2010,2290,2610,3290];
function line(w,h,data,col){var mn=Math.min.apply(0,data)*0.9,mx=Math.max.apply(0,data),p=[];
 data.forEach(function(d,i){p.push((i*(w-20)/(data.length-1)+10).toFixed(1)+','+(h-10-(d-mn)/(mx-mn)*(h-24)).toFixed(1))});
 var last=p[p.length-1].split(',');
 return '<svg class="ch" viewBox="0 0 '+w+' '+h+'" height="'+h+'" preserveAspectRatio="none"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".25"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
 [0.25,0.5,0.75].map(function(f){return '<line x1="0" x2="'+w+'" y1="'+(h*f)+'" y2="'+(h*f)+'" stroke="#2D2D2D" stroke-dasharray="3 4"/>'}).join('')+
 '<polygon fill="url(#gr)" points="10,'+h+' '+p.join(' ')+' '+(w-10)+','+h+'"/><polyline fill="none" stroke="'+col+'" stroke-width="2.5" points="'+p.join(' ')+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="4.5" fill="'+col+'"/></svg>'}
var ent=[300,340,310,420,380,450,510,480,520,540,560,574],sai=[260,300,350,210,285,330,390,330,425,330,402,241];
function bars(w,h){var mx=600,bw=(w-20)/ent.length,o='<svg class="ch" viewBox="0 0 '+w+' '+h+'" height="'+h+'" preserveAspectRatio="none">';
 [0.25,0.5,0.75].forEach(function(f){o+='<line x1="0" x2="'+w+'" y1="'+(h*f)+'" y2="'+(h*f)+'" stroke="#2D2D2D" stroke-dasharray="3 4"/>'});
 ent.forEach(function(e,i){var x=10+i*bw,a=e/mx*(h-8),b=sai[i]/mx*(h-8);
  o+='<rect x="'+(x+bw*.12)+'" y="'+(h-a)+'" width="'+(bw*.34)+'" height="'+a+'" rx="3" fill="#3EA66B"/><rect x="'+(x+bw*.5)+'" y="'+(h-b)+'" width="'+(bw*.34)+'" height="'+b+'" rx="3" fill="#E5534B"/>'});
 return o+'</svg>'}
var weeks=[['Semana 12','+$333,00','up'],['Semana 11','+$158,00','up'],['Semana 10','−$40,00','dn'],['Semana 9','+$210,00','up'],['Semana 8','+$95,00','up']];
var det=[['Anúncios (RPM $2,10 · 196 mil views)','+$412,00','up'],['Meio período (Café do Zé)','+$150,00','up'],['Poupança (rendimento)','+$12,00','up'],['Custo de vida','−$80,00','dn'],['Imposto semanal (10%)','−$41,00','dn'],['Loja: Microfone USB','−$120,00','dn']];
function extrato(open,cols){cols=cols||'1fr 110px 90px';var o='<div class="tr h" style="grid-template-columns:'+cols+'"><span>SEMANA</span><span class="r">RESULTADO</span><span class="r">STATUS</span></div>';
 weeks.forEach(function(w,i){o+='<div class="tr'+(i==0?' me':'')+'" style="grid-template-columns:'+cols+'"><span>'+w[0]+(i==0?' (atual)':'')+'</span><span class="r '+w[2]+'">'+w[1]+'</span><span class="r"><span class="pill '+(w[2]=='up'?'g1':'l1')+'">'+(w[2]=='up'?'Lucro':'Prejuízo')+'</span></span></div>';
  if(open&&i==0)det.forEach(function(d){o+='<div class="tr sub" style="grid-template-columns:'+cols+'"><span>'+d[0]+'</span><span class="r '+d[2]+'">'+d[1]+'</span><span></span></div>'})});
 return o}
function cobr(){return [['Custo de vida','Todo dia 7 · $80,00','Fixo'],['Imposto semanal','Em 2 dias · ~$45,00','Variável'],['Dívida fiscal','Em atraso · $62,00 + juros','Atrasado']].map(function(c,i){
 return '<div class="row2"><div><div style="font-size:13px;font-weight:600">'+c[0]+'</div><div class="k">'+c[1]+'</div></div><span class="pill '+(i==2?'l1':i==1?'a1':'')+'">'+c[2]+'</span></div>'}).join('')}
function dot(c){return '<span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+c+';margin-right:8px"></span>'}
function cats(){var c=[['Custo de vida',80,'#E53935'],['Imposto',41,'#D9A441'],['Equipamentos',120,'#9B7BD6']];
 return '<div class="bar" style="height:12px">'+c.map(function(x){return '<span style="width:'+(x[1]/241*100)+'%;background:'+x[2]+'"></span>'}).join('')+'</div><div style="margin-top:8px">'+
 c.map(function(x){return '<div class="row2"><span>'+dot(x[2])+x[0]+'</span><span>$'+x[1]+',00</span></div>'}).join('')+'</div>'}
function compo(){var a=[['Dinheiro',2340,'#3EA66B'],['Poupança',1012,'#9B7BD6'],['Dívida fiscal',-62,'#E5534B']];
 return '<div class="bar" style="height:12px"><span style="width:69%;background:#3EA66B"></span><span style="width:30%;background:#9B7BD6"></span></div><div style="margin-top:8px">'+
 a.map(function(x){return '<div class="row2"><span>'+dot(x[2])+x[0]+'</span><span class="'+(x[1]<0?'dn':'')+'">'+(x[1]<0?'−':'')+'$'+Math.abs(x[1]).toLocaleString('pt-BR')+',00</span></div>'}).join('')+
 '<div class="row2"><b>Patrimônio</b><b>$3.290,00</b></div></div>'}
function entradas(){return '<div class="row2"><span>Anúncios (RPM)</span><span class="up">+$412</span></div><div class="row2"><span>Meio período</span><span class="up">+$150</span></div><div class="row2"><span>Investimentos</span><span class="up">+$12</span></div>'}
function saidas(){return '<div class="row2"><span>Custo de vida</span><span class="dn">−$80</span></div><div class="row2"><span>Imposto semanal</span><span class="dn">−$41</span></div><div class="row2"><span>Equipamentos</span><span class="dn">−$120</span></div>'}
function K4(){return '<div class="g" style="grid-template-columns:repeat(4,1fr)">'+kpi('Disponível','$2.340,00','up','Pronto para gastar')+kpi('Investido','$1.012,00','','Poupança · +$12 na semana')+kpi('Resultado da semana','+$333,00','up','Entrou $574 · saiu $241')+kpi('Lucro no ano','+$3.180,00','up','Ano 1 · 84 dias')+'</div>'}
function legend(t,p,c,rec){return '<b>'+t+(rec?' (recomendada)':'')+'</b> &nbsp; <span class="p">Prós:</span> '+p+' &nbsp; <span class="c">Contras:</span> '+c}
var O={
A:{n:'A. Extrato',l:legend('A. Extrato','simples, parece um banco; o extrato por semana é a estrela.','o Patrimônio (que alimenta o ranking) fica escondido.'),
 h:function(){return shell(tabs()+K4()+'<div class="g" style="grid-template-columns:1fr 1fr"><div class="cd"><div class="t">Entradas x saídas<small>últimas 12 semanas</small></div>'+bars(440,200)+'<div class="k" style="margin-top:8px"><span class="up">■</span> Entradas &nbsp; <span class="dn">■</span> Saídas</div></div><div class="cd" style="padding:6px 4px"><div class="t" style="padding:8px 10px 0">Extrato por semana</div>'+extrato(true,'1fr 90px 80px')+'</div></div>')}},
B:{n:'B. Patrimônio',l:legend('B. Patrimônio em destaque','mostra o que mais importa para o ranking; gráfico grande motiva.','número grande pode confundir quem só quer saber "quanto ganhei".'),
 h:function(){return shell(tabs()+'<div class="g" style="grid-template-columns:2fr 1fr"><div class="cd"><div class="k">Patrimônio</div><div style="display:flex;gap:12px;align-items:center"><div class="v xl">$3.290,00</div><span class="pill g1">+$680 em 4 semanas</span></div>'+line(560,170,pat,'#3EA66B')+'</div><div style="display:grid;gap:12px"><div class="cd"><div class="t">Entradas<small>semana</small></div>'+entradas()+'</div><div class="cd"><div class="t">Saídas<small>semana</small></div>'+saidas()+'</div></div></div>'+
 '<div class="cd" style="padding:6px 4px"><div class="t" style="padding:8px 10px 0">Extrato por semana</div>'+extrato(false)+'</div>')}},
C:{n:'C. Próximas cobranças',l:legend('C. Próximas cobranças','avisa antes das contas; evita susto com a dívida fiscal.','muita "obrigação" e pouca conquista.'),
 h:function(){return shell(tabs()+K4()+'<div class="g" style="grid-template-columns:1.5fr 1fr"><div class="cd" style="padding:6px 4px"><div class="t" style="padding:8px 10px 0">Extrato por semana</div>'+extrato(true,'1fr 90px 80px')+'</div><div style="display:grid;gap:12px;align-content:start"><div class="cd"><div class="t">Próximas cobranças</div>'+cobr()+'<div class="btn n" style="margin-top:12px;justify-content:center;font-size:13px;height:32px">Pagar dívida fiscal</div></div><div class="cd"><div class="t">Para onde foi o dinheiro<small>semana</small></div>'+cats()+'</div></div></div>')}},
D:{n:'D. Painel completo',rec:1,l:legend('D. Painel do criador','junta o melhor das outras e cresce com Investimentos, Mercado e Colecionáveis.','é a tela mais cheia.',1),
 h:function(){return shell(tabsD()+K4D()+'<div class="g" style="grid-template-columns:1.3fr 1fr"><div class="cd"><div class="t">Patrimônio por semana<small>12 semanas</small></div><div style="display:flex;gap:10px;align-items:center;margin-bottom:4px"><div class="v">$2.278,00</div><span class="pill g1">+$840 em 8 semanas</span></div>'+line(480,100,patD,'#3EA66B')+'<div class="t" style="margin:8px 0 6px">Composição</div>'+compoD()+'</div>'+
 '<div style="display:grid;gap:12px;align-content:start"><div class="cd"><div class="t">Entradas<small>+$574</small></div>'+entradasD()+'</div><div class="cd"><div class="t">Saídas<small>−$307</small></div>'+saidasD()+'</div></div></div>'+
 '<div class="cd" style="padding:8px 4px;margin-top:20px;margin-bottom:28px"><div class="t" style="padding:10px 18px 0;margin-bottom:12px">Extrato<small>últimas 8 semanas</small></div>'+extD()+'</div>','2 canais')}}
};
