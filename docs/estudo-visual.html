<style>
:root{
  color-scheme: dark;
  --page:#0a0a0a; --page-text:#f1f1f1; --page-muted:#9a9a9a; --page-line:#2a2a2a; --page-accent:#ff2d2d;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--page-text);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:20px;padding-bottom:40px;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 4px var(--page-accent)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--page-muted);font-size:13px;margin:0 0 14px}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.picker a{padding:6px 10px;border:1px solid var(--page-line);border-radius:8px;background:#141414;font-size:12px;font-weight:500;color:#ddd}
.picker a:hover{background:#222}
.picker a[aria-current="true"]{background:var(--page-accent);border-color:var(--page-accent);color:#fff}
.stage{max-width:100%;overflow-x:auto;border-radius:14px;border:1px solid var(--page-line);background:#000;-webkit-overflow-scrolling:touch}

/* ===== TOKENS (V1 Studio) ===== */
#app{
  --bg:#0f0f0f; --panel:#1f1f1f; --panel2:#141414; --hover:#262626; --line:#2d2d2d;
  --text:#f1f1f1; --muted:#aaaaaa; --accent:#ff0000; --accent-text:#fff;
  --c-gain:#3ea66b; --c-twitch:#9b7bd6; --c-loss:#e5534b;
  --r:10px; --font:Inter,"Segoe UI",Roboto,Arial,sans-serif;
}

/* ===== JANELA ===== */
.win{width:1200px;height:768px;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;display:flex;position:relative;overflow:hidden}
.win *{scrollbar-width:thin}
.side{width:196px;background:var(--panel2);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex:none}
.logo{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;font-weight:600;font-size:17px}
.logo i{width:30px;height:22px;background:var(--accent);border-radius:6px;display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);color:var(--muted);font-weight:500;border:1px solid transparent}
.nav:hover{background:var(--hover);color:var(--text)}
.nav[aria-current="page"]{background:var(--panel);color:var(--text);border-color:var(--line)}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hd{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:8}
.ddwrap{position:relative}
.chsel{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:4px 10px 4px 6px;color:inherit;font:inherit;cursor:pointer;text-align:left}
.chsel:hover,.chsel.open{background:var(--hover);border-color:var(--line)}
.chsel b{display:block;font-weight:600;font-size:15px;white-space:nowrap}
.chsel small{color:var(--muted);font-size:12px;white-space:nowrap}
.caret{color:var(--muted);font-size:11px}
.dd{position:absolute;top:calc(100% + 6px);left:0;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.65);padding:6px}
.dd .it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.dd .it:hover{background:var(--hover)}
.dd .it.on{background:var(--panel2)}
.dd hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.stat{padding:4px 12px;border-left:1px solid var(--line);white-space:nowrap;position:relative}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:16px;font-weight:600}
.sp{flex:1}
.body{flex:1;overflow:auto;padding:18px}
h2{font-weight:600;font-size:19px;margin:0 0 4px}
h3{font-weight:600;font-size:14px;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 14px;font-size:13px}
.muted{color:var(--muted)}
.xs{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.row{display:flex;align-items:center;gap:10px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--hover);color:var(--text);padding:8px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.big{padding:12px 22px;font-size:16px}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500}
.btn.ghost:hover{color:var(--c-loss);border-color:var(--c-loss);filter:none}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.gain{color:var(--c-gain);border-color:var(--c-gain)}
.pill.loss{color:var(--c-loss);border-color:var(--c-loss)}
.pill.tw{color:var(--c-twitch);border-color:var(--c-twitch)}
.pill.red{color:var(--accent);border-color:var(--accent)}
.pill.soft{color:var(--text)}
.up{color:var(--c-gain)}.down{color:var(--c-loss)}.tw{color:var(--c-twitch)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.gain>i{background:var(--c-gain)}.bar.soft>i{background:var(--text)}
.kpi small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.kpi b{font-weight:600;font-size:22px}
.kpi span{font-size:12px;margin-left:6px}
.thumb{aspect-ratio:16/9;border-radius:8px;position:relative;display:grid;place-items:center;overflow:hidden}
.thumb svg{width:34px;height:34px;opacity:.85}
.thumb em{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);font-style:normal;font-size:11px;padding:1px 5px;border-radius:4px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:var(--hover)}
.tbl .me td{background:color-mix(in srgb,var(--accent) 18%,var(--panel));border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);font-weight:700}
.tbl.mini td,.tbl.mini th{padding:5px 8px;font-size:13px}
.tbl.mini th{font-size:11px}
.num{text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px}
.tab.on{color:var(--text);border-color:var(--accent)}
.tab.soon{color:var(--c-twitch)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--muted);cursor:pointer}
.chip:hover{background:var(--hover);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.off{opacity:.4;cursor:not-allowed}
.chip.match{border-color:var(--c-gain)}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--text);font:inherit}
label.l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
.sec{margin-top:16px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:9}
.modal .card{width:480px;background:var(--panel)}
.ico{width:38px;height:38px;border-radius:var(--r);display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);flex:none}
.ico svg{width:20px;height:20px}
.lvl{display:flex;gap:3px}.lvl i{width:16px;height:6px;background:var(--panel2);border:1px solid var(--line);border-radius:2px}.lvl i.f{background:var(--text);border-color:var(--text)}
.step{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);flex:1;min-width:0;font-size:12px}
.step b{font-size:13px}
.step.done{border-color:var(--c-gain)}.step.cur{border-color:var(--accent)}.step.lock{opacity:.5}
.tl{display:flex;height:34px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.tl i{flex:1;border-right:1px solid var(--bg);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#000}
.hr{border:0;border-top:1px solid var(--line);margin:12px 0}
/* ajuda */
.help{position:relative;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:700;line-height:1;padding:0;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;text-transform:none;letter-spacing:0;flex:none}
.help:hover,.help:focus,.help.open{border-color:var(--text);color:var(--text)}
.help .tip{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:230px;background:#303030;color:var(--text);border:1px solid #444;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:400;line-height:1.4;text-align:left;text-transform:none;letter-spacing:0;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.6);cursor:default}
.help.r .tip{left:auto;right:-8px;transform:none}
.help:focus .tip,.help.open .tip{display:block}
@media (hover:hover){.help:hover .tip{display:block}}
/* videos */
.vcard{padding:10px}
.vcard .t{display:block;margin:8px 0 4px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.cm svg{width:14px;height:14px}
/* criar */
.pick{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--panel2);border-radius:var(--r);padding:10px 12px;cursor:pointer;font:inherit;color:var(--text);text-align:left;width:100%}
.pick:hover{background:var(--hover)}
.pick.on{border-color:var(--accent)}
.tpick{border:2px solid transparent;border-radius:10px;padding:0;background:none;cursor:pointer;color:inherit}
.tpick.on{border-color:var(--accent)}
.preview{position:sticky;top:0;align-self:start}
/* inicial */
.start{flex:1;display:grid;place-items:center;text-align:center;padding:30px;position:relative}
.start h1{font-weight:600;font-size:62px;margin:10px 0 4px;letter-spacing:-.02em}
.start .menu{display:flex;flex-direction:column;gap:12px;width:300px;margin:26px auto 0}
.start .menu .btn{justify-content:center}
.play{width:92px;height:64px;background:var(--accent);border-radius:18px;display:grid;place-items:center;margin:0 auto}
.play svg{width:34px;height:34px;color:#fff}
@media (max-width:600px){body{padding-top:12px}.picker a{padding:7px 10px}}
</style>

function parse(){var m=/^#([a-z]+)$/.exec(location.hash);return m&&S[m[1]]?m[1]:'inicial';}
function render(){var s=parse(),app=document.getElementById('app');
var b=app.querySelector('.body'),top=b?b.scrollTop:0;
app.innerHTML=S[s]();
var nb=app.querySelector('.body');if(nb)nb.scrollTop=top;
document.getElementById('spick').innerHTML=SCREENS.map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===s?' aria-current="true"':'')+'>'+x[1]+'</a>';}).join('');
document.title='TubeStar Novo Visual';}

function act(a,i){
if(a==='menu')st.menu=!st.menu;
else if(a==='ch'){st.cur=i;st.menu=false;}
else if(a==='tab')st.cur=i;
else if(a==='filt')st.filt=i;
else if(a==='dest')st.dest=i;
else if(a==='cat')st.cat=i;
else if(a==='thumbs')st.thumbs=!st.thumbs;
else if(a==='thumb')st.thumb=i;
else if(a==='tipo')st.tipo=i;
else if(a==='inv')st.inv=i;
else if(a==='isca'){var k=st.iscas.indexOf(i);if(k>=0)st.iscas.splice(k,1);else if(st.iscas.length<2)st.iscas.push(i);}
else if(a==='nicho')st.nicho=i;
else if(a==='promo')st.promo=i;
else if(a==='publish')st.posted=true;
render();}

document.addEventListener('click',function(e){
var t=e.target;if(!t.closest)return;
var h=t.closest('.help');
var opened=document.querySelectorAll('.help.open');
for(var k=0;k<opened.length;k++){if(opened[k]!==h)opened[k].classList.remove('open');}
if(h){h.classList.toggle('open');return;}
var a=t.closest('[data-act]');
if(a){act(a.getAttribute('data-act'),parseInt(a.getAttribute('data-i'),10));return;}
if(st.menu&&!t.closest('.ddwrap')){st.menu=false;render();}
});
document.addEventListener('input',function(e){
if(e.target.id==='t')st.title=e.target.value;
if(e.target.id==='nn')st.nn=e.target.value;
});
window.addEventListener('hashchange',function(){st.menu=false;st.posted=false;render();});
render();
})();
</script>
