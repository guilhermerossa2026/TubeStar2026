var FEE=2,TAX=.15,pxN=181.42;
/* mesma conta para o painel de venda e para "Sua posição" */
function sellCalc(q){var gross=q*pxN,gain=Math.max(0,(pxN-POS.avg)*q),tax=gain*TAX,fee=q>0?FEE:0;return {gross:gross,fee:fee,tax:tax,net:Math.max(0,gross-fee-tax)}}
function posCard(a){if(!POS.qty)return '<div class="cd"><div class="t">Sua posição</div><div class="k">Você ainda não tem '+a.t+'.</div></div>';
 var cost=r2(POS.qty*POS.avg),now=r2(POS.qty*a.p),res=r2(now-cost),p=res/cost*100,g=res>=0;
 return '<div class="cd"><div class="t">Sua posição</div>'+
 '<div class="row2"><span class="mu">Quantidade</span><b>'+POS.qty+' ações</b></div>'+
 '<div class="row2"><span class="mu">Preço médio</span><b>'+usd(POS.avg)+'</b></div>'+
 '<div class="row2"><span class="mu">Total investido</span><b>'+usd(cost)+'</b></div>'+
 '<div class="row2"><span class="mu">Variação desde a compra</span><b class="'+(g?'up':'dn')+'">'+(g?'+':'−')+usd(Math.abs(res))+' ('+pc(p)+')</b></div>'+
 '<div class="k" style="margin-top:6px;font-size:11px;line-height:1.4">Sem descontos. O valor que você recebe aparece em Vender.</div></div>'}
function calc(src){var fv=document.getElementById('fv'),fq=document.getElementById('fq'),buy=mode=='buy',v,q;
 if(src=='v'){v=parseFloat(fv.value)||0;q=buy?Math.max(0,(v-FEE)/pxN):v/pxN;fq.value=v?q.toFixed(4):''}
 else{q=parseFloat(fq.value)||0;v=buy?q*pxN+FEE:q*pxN;fv.value=q?v.toFixed(2):''}
 sum(q,v)}
function pct(p){var buy=mode=='buy';if(buy){document.getElementById('fv').value=(CASH*p/100).toFixed(2);calc('v')}else{document.getElementById('fq').value=(POS.qty*p/100).toFixed(4);calc('q')}}
function sum(q,v){var buy=mode=='buy',el=document.getElementById('sum'),go=document.getElementById('go'),row=function(a,b,c){return '<div class="row2" style="padding:4px 0"><span class="mu">'+a+'</span><span class="'+(c||'')+'">'+b+'</span></div>'},ok=q>0,msg='';
 if(buy){if(v>CASH){ok=false;msg='Dinheiro insuficiente'}if(q>0&&v<10){ok=false;msg='Valor mínimo $10.00'}
  el.innerHTML=row('Corretagem',usd(FEE))+row('Você paga',usd(q>0?v:0))+row('Você recebe',(q>0?q.toFixed(4):'0.0000')+' NVDA')}
 else{if(q>POS.qty+1e-9){ok=false;msg='Você não tem tudo isso'}var s=sellCalc(q);
  el.innerHTML=row('Valor da venda',usd(s.gross))+row('Corretagem','−'+usd(s.fee))+row('Imposto estimado (15% do lucro)','−'+usd(s.tax))+row('Você recebe',usd(s.net),'up')}
 if(msg)el.innerHTML+='<div class="k dn" style="margin-top:4px">'+msg+'</div>';
 go.className='btn '+(buy?'gain':'loss')+(ok?'':' disabled')}
